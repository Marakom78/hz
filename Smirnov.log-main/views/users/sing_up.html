<h1>Ркгистрация пользователя</h1>

<div class="m-3 col-md-6">
    <form action="" method="POST">
        <div class="mb-3">
            <label for="inputName" class="form-label">Логин</label>
            <input type="text" id="inputName" class="form-controll" name="nickname">
        </div>
        
        <div class="mb-3">
            <label for="inputEmail" class="form-label">Email</label>
            <input type="email" id="inputEmail" class="form-controll" name="email">
        </div>

        <div class="mb-3">
            <label for="inputPassword" class="form-label">Пароль</label>
            <input type="password" id="inputPassword" class="form-controll" name="email">
        </div>

        <input type="submit" class="btn btn-primary">
    </form>
</div>
